# Local development only. Production runs on the VPS (see docs/DEPLOYMENT.md, added in Phase 6).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reminder
      POSTGRES_PASSWORD: reminder_dev_only
      POSTGRES_DB: reminder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
